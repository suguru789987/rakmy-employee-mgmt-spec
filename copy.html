<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コピペ用｜従業員管理の資料</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#24292f}
.topbar{background:#24292f;color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-weight:700}
.topbar a{color:#fff;text-decoration:none;font-weight:400;font-size:13px;opacity:.85}
.topbar a:hover{opacity:1;text-decoration:underline}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d0d7de;padding:10px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .grp{display:flex;gap:6px;align-items:center}
.bar button{padding:7px 12px;border:1px solid #d0d7de;background:#fff;border-radius:6px;font-size:13px;cursor:pointer}
.bar button.on{background:#24292f;color:#fff;border-color:#24292f}
.bar button.act{background:#1f883d;color:#fff;border-color:#1f883d;font-weight:700}
.bar button.act:hover{background:#1a7f37}
.bar .sep{width:1px;height:22px;background:#d0d7de;margin:0 4px}
.bar .hint{font-size:12px;color:#57606a;margin-left:auto}
.wrap{max-width:1000px;margin:18px auto;padding:0 16px}
.sec{position:relative;background:#fff;border:1px solid #d0d7de;border-radius:8px;margin-bottom:14px;padding:8px 28px 20px}
.sec>.copy{position:absolute;top:10px;right:12px;font-size:12px;padding:5px 10px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;cursor:pointer;opacity:.5;transition:.15s}
.sec:hover>.copy{opacity:1}
.sec>.copy.done{background:#1f883d;color:#fff;border-color:#1f883d;opacity:1}
.markdown-body{background:transparent}
.markdown-body table{display:table;width:100%;overflow-x:auto}
.markdown-body pre{background:#f6f8fa}
table.tsv{border-collapse:collapse;font-size:12.5px;width:100%;display:block;overflow-x:auto;white-space:pre-wrap}
table.tsv th,table.tsv td{border:1px solid #d0d7de;padding:6px 9px;text-align:left;vertical-align:top;line-height:1.6}
table.tsv thead th{background:#f6f8fa;position:sticky;top:52px;white-space:nowrap}
table.tsv tr.prep{background:#fffbe6}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f883d;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:720px){.wrap{padding:0 8px}.sec{padding:8px 14px 16px}}
</style>
</head>
<body>
<div class="topbar">
  📋 コピペ用｜従業員管理の資料
  <a href="index.html">← トップ</a>
  <a href="pdm-spec.html">仕様書ビューア</a>
  <a href="acceptance.html">受入条件表</a>
  <a href="test-plan.html">検証プラン</a>
</div>

<div class="bar">
  <div class="grp">
    <button class="doc on" data-k="spec">仕様書（PdM版）</button>
    <button class="doc" data-k="help">ヘルプページ</button>
    <button class="doc" data-k="ac">受入条件表</button>
    <button class="doc" data-k="tp">検証プラン</button>
  </div>
  <span class="sep"></span>
  <div class="grp">
    <button class="fmt on" data-f="rich">書式つき</button>
    <button class="fmt" data-f="plain">プレーン</button>
  </div>
  <span class="sep"></span>
  <button class="act" id="copyAll">全文をコピー</button>
  <span class="hint" id="hint">見出しにカーソルを合わせると、その節だけコピーできます</span>
</div>

<div class="wrap" id="out">読み込み中…</div>
<div class="toast" id="toast">コピーしました</div>

<script>
var DOCS={
  spec:{type:'md', file:'20260803_01_従業員管理_仕様書_PdM版.md', label:'仕様書（PdM版）',
        hint:'見出し（#／##）ごとにコピーできます。Notion・Googleドキュメント・Wordにそのまま貼れます'},
  help:{type:'md', file:'20260803_ヘルプページ_従業員管理_ドラフト.md', label:'ヘルプページ ドラフト',
        hint:'掲載時は「## 従業員の設定と人件費を管理する」以降のみを貼り付けてください（冒頭の枠は社内用）'},
  ac:{type:'tsv', file:'20260803_02_従業員管理_受入条件表.tsv', label:'受入条件表',
      hint:'表をそのままコピーできます。Excel・スプレッドシートに貼るとセルに分かれます'},
  tp:{type:'tsv', file:'20260803_03_従業員管理_検証プラン.tsv', label:'検証プラン',
      hint:'表をそのままコピーできます。Excel・スプレッドシートに貼るとセルに分かれます'}
};
var cur='spec', fmt='rich', raw='', sections=[];

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1400);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function copy(html, text, btn){
  var done=function(){ if(btn){btn.classList.add('done');var o=btn.textContent;btn.textContent='コピーしました';setTimeout(function(){btn.classList.remove('done');btn.textContent=o;},1400);} toast('コピーしました'); };
  if(fmt==='rich' && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html],{type:'text/html'}),
      'text/plain': new Blob([text],{type:'text/plain'})
    })]).then(done).catch(function(){ fallback(text, done); });
  } else { fallback(text, done); }
}
function fallback(text, done){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(function(){manual(text,done);}); }
  else manual(text,done);
}
function manual(text, done){
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ alert('コピーできませんでした。手動で選択してください'); }
  document.body.removeChild(ta);
}

function renderMd(text){
  // # / ## 見出しで節に分割
  var lines=text.split('\n'), blocks=[], buf=[], inFence=false;
  lines.forEach(function(l){
    if(/^```/.test(l)) inFence=!inFence;
    if(!inFence && /^#{1,2} /.test(l) && buf.length){ blocks.push(buf.join('\n')); buf=[]; }
    buf.push(l);
  });
  if(buf.length) blocks.push(buf.join('\n'));
  sections=blocks;
  var out='';
  blocks.forEach(function(b,i){
    out+='<div class="sec"><button class="copy" data-i="'+i+'">この節をコピー</button>'
       + '<div class="markdown-body" id="sec'+i+'">'+marked.parse(b)+'</div></div>';
  });
  document.getElementById('out').innerHTML=out;
  Array.prototype.forEach.call(document.querySelectorAll('.sec .copy'), function(b){
    b.addEventListener('click', function(){
      var i=b.dataset.i;
      copy(document.getElementById('sec'+i).innerHTML, sections[i], b);
    });
  });
}

function renderTsv(text){
  var rows=text.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(function(l){return l.split('\t');});
  sections=[text];
  var h='<div class="sec"><button class="copy" data-i="0">表をコピー</button><table class="tsv"><thead><tr>'
        + rows[0].map(function(c){return '<th>'+esc(c)+'</th>';}).join('') + '</tr></thead><tbody>';
  for(var i=1;i<rows.length;i++){
    h+='<tr'+(rows[i][0]==='準備'?' class="prep"':'')+'>'+rows[i].map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';
  }
  h+='</tbody></table></div>';
  document.getElementById('out').innerHTML=h;
  document.querySelector('.sec .copy').addEventListener('click', function(){
    copy(document.querySelector('table.tsv').outerHTML, text, this);
  });
}

function load(){
  var d=DOCS[cur];
  document.getElementById('hint').textContent=d.hint;
  document.getElementById('out').textContent='読み込み中…';
  fetch(encodeURI(d.file)).then(function(r){return r.text();}).then(function(t){
    raw=t;
    if(d.type==='md') renderMd(t); else renderTsv(t);
  }).catch(function(e){ document.getElementById('out').textContent=d.file+' を読み込めませんでした: '+e; });
}
document.getElementById('copyAll').addEventListener('click', function(){
  var html=Array.prototype.map.call(document.querySelectorAll('.sec .markdown-body, .sec table.tsv'), function(n){return n.outerHTML;}).join('');
  copy(html, raw, null);
});
Array.prototype.forEach.call(document.querySelectorAll('button.doc'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('button.doc'), function(x){x.classList.remove('on');});
    b.classList.add('on'); cur=b.dataset.k; load();
  });
});
Array.prototype.forEach.call(document.querySelectorAll('button.fmt'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('button.fmt'), function(x){x.classList.remove('on');});
    b.classList.add('on'); fmt=b.dataset.f;
    toast(fmt==='rich' ? '書式つきでコピーします（Notion・Docs向け）' : 'プレーンテキストでコピーします（Slack・GitHub向け）');
  });
});
load();
</script>
</body>
</html>

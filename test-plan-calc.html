<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>検証プラン（計算系・準備7＋検証18件）</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#24292f}
.topbar{background:#bf3989;color:#fff;padding:12px 24px;font-weight:700;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topbar a{color:#fff;text-decoration:none;font-weight:400;font-size:14px;opacity:.9}
.topbar a:hover{opacity:1;text-decoration:underline}
.wrap{max-width:1600px;margin:20px auto;padding:0 16px}
.head{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:16px 20px;margin-bottom:14px}
.head h1{font-size:18px;margin:0 0 6px}
.head p{margin:4px 0;font-size:13px;color:#57606a;line-height:1.7}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tools input{padding:7px 10px;border:1px solid #d0d7de;border-radius:6px;font-size:13px;min-width:240px}
.tools .cnt{font-size:12px;color:#57606a}
.tools a.dl{font-size:12px;color:#0969da;text-decoration:none;border:1px solid #d0d7de;padding:6px 10px;border-radius:6px;background:#fff}
.box{background:#fff;border:1px solid #d0d7de;border-radius:8px;overflow:auto;max-height:78vh}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:pre-wrap}
th,td{border-bottom:1px solid #eaeef2;border-right:1px solid #eaeef2;padding:8px 10px;vertical-align:top;text-align:left;line-height:1.6}
thead th{position:sticky;top:0;background:#f6f8fa;font-weight:600;z-index:2;border-bottom:2px solid #d0d7de;white-space:nowrap}
tbody tr:hover{background:#f6f8fa}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;font-weight:600;z-index:1;white-space:nowrap}
thead th:first-child{z-index:3;background:#f6f8fa}
tbody tr:hover td:first-child{background:#f6f8fa}
td.id{white-space:nowrap;font-weight:600}
.mark-must{color:#cf222e;font-weight:700}
.mark-star{background:#fff8c5}
@media(max-width:720px){.wrap{padding:0 8px}table{font-size:11.5px}}
</style>
</head>
<body>
<div class="topbar">
  🧮 検証プラン（計算系・準備7＋検証18件）
  <a href="index.html">← トップ</a>
  <a href="pdm-spec.html">仕様書（PdM版）</a>
  <a href="acceptance.html">受入条件表</a>
  <a href="test-plan-ops.html">検証プラン（操作系）</a>
  <a href="test-plan-calc.html">検証プラン（計算系）</a>
</div>
<div class="wrap">
  <div class="head">
    <h1>検証プラン（計算系・準備7＋検証18件）</h1>
    <p>人件費の計算・締め・日割りの検証。上部の「準備」行（CS-01〜CS-07）に算式・基礎時給・所定労働日数などの初期入力値を集約しています。<strong>CS-01（算式の確定）とCS-02（サンプルデータの再作成）はゲート</strong>で、ここが終わるまで以降は開始できません。「計算根拠」列に実データでの検算結果を記載しています。</p>
    <div class="tools">
      <input id="q" type="search" placeholder="絞り込み（例: 締め / Must / 異常 / AC-16）">
      <span class="cnt" id="cnt"></span>
      <a class="dl" id="dl" href="#" download>TSVをダウンロード</a>
    </div>
  </div>
  <div class="box"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
var FILE = '20260803_03b_従業員管理_検証プラン_計算系.tsv';
document.getElementById('dl').href = encodeURI(FILE);
var rows = [];
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function deco(s){
  var h = esc(s);
  if(h === 'Must') return '<span class="mark-must">Must</span>';
  return h;
}
function render(filter){
  var tb = document.getElementById('tb'), out = '', n = 0;
  for(var i=1;i<rows.length;i++){
    var r = rows[i];
    if(filter && r.join(' ').toLowerCase().indexOf(filter) < 0) continue;
    n++;
    var star = r.join(' ').indexOf('★') >= 0 ? ' class="mark-star"' : '';
    out += '<tr' + star + '>';
    for(var j=0;j<r.length;j++){ out += (j===0?'<td class="id">':'<td>') + deco(r[j]) + '</td>'; }
    out += '</tr>';
  }
  tb.innerHTML = out;
  document.getElementById('cnt').textContent = n + ' 件 / 全 ' + (rows.length-1) + ' 件';
}
fetch(encodeURI(FILE)).then(function(r){return r.text();}).then(function(t){
  rows = t.replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(function(l){return l.split('\t');});
  document.getElementById('th').innerHTML = '<tr>' + rows[0].map(function(h){return '<th>'+esc(h)+'</th>';}).join('') + '</tr>';
  render('');
}).catch(function(e){
  document.getElementById('tb').innerHTML = '<tr><td>' + FILE + ' を読み込めませんでした: ' + e + '</td></tr>';
});
document.getElementById('q').addEventListener('input', function(e){ render(e.target.value.toLowerCase()); });
</script>
</body>
</html>

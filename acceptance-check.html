<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受入条件 確認表（記入用）</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#24292f}
.topbar{background:#0969da;color:#fff;padding:12px 24px;font-weight:700;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topbar a{color:#fff;text-decoration:none;font-weight:400;font-size:14px;opacity:.9}
.topbar a:hover{opacity:1;text-decoration:underline}
.wrap{max-width:1500px;margin:20px auto;padding:0 16px}
.intro{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:16px 20px;margin-bottom:14px;font-size:13px;line-height:1.85;color:#57606a}
.intro h1{font-size:18px;margin:0 0 8px;color:#24292f}
.verdict{position:sticky;top:0;z-index:30;background:#fff;border:2px solid #d0d7de;border-radius:8px;padding:14px 20px;margin-bottom:14px}
.verdict.go{border-color:#1f883d;background:#f0fff4}.verdict.cond{border-color:#bf8700;background:#fffbef}.verdict.nogo{border-color:#cf222e;background:#fff5f5}
.verdict .big{font-size:19px;font-weight:700}
.verdict .sub{font-size:13px;color:#57606a;margin-top:6px;line-height:1.8}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tools button{padding:7px 12px;border:1px solid #d0d7de;background:#fff;border-radius:6px;font-size:13px;cursor:pointer}
.tools button.on{background:#24292f;color:#fff;border-color:#24292f}
.tools input{padding:7px 10px;border:1px solid #d0d7de;border-radius:6px;font-size:13px}
.tools .cnt{font-size:12px;color:#57606a;margin-left:auto}
.tools a.dl{font-size:12px;color:#0969da;text-decoration:none;border:1px solid #d0d7de;padding:6px 10px;border-radius:6px;background:#fff}
.box{background:#fff;border:1px solid #d0d7de;border-radius:8px;overflow:auto;max-height:74vh}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:pre-wrap;width:100%}
th,td{border-bottom:1px solid #eaeef2;border-right:1px solid #eaeef2;padding:8px 10px;vertical-align:top;text-align:left;line-height:1.7}
thead th{position:sticky;top:0;background:#f6f8fa;font-weight:600;z-index:2;border-bottom:2px solid #d0d7de;white-space:nowrap}
td.id{white-space:nowrap;font-weight:600}
tr.l0 td.id{color:#cf222e}
tr.ok{background:#f6fff8}tr.ng{background:#fff5f5}
select,input.memo{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid #d0d7de;border-radius:5px;width:100%}
select.ok{background:#dafbe1}select.ng{background:#ffebe9}
@media(max-width:720px){.wrap{padding:0 8px}table{font-size:11.5px}}
@media print{.topbar,.tools,.intro{display:none}.box{max-height:none;border:0}.verdict{position:static}}
</style>
</head>
<body>
<div class="topbar">
  ✅ 受入条件 確認表（記入用）
  <a href="index.html">← トップ</a>
  <a href="acceptance.html">定義表</a>
  <a href="test-plan.html">検証プラン</a>
  <a href="milestone.html">実装マイルストーン</a>
</div>
<div class="wrap">
  <div class="intro">
    <h1>使い方</h1>
    <strong>検証の結果をここに記入します。</strong>「何を満たせば合格か」は<a href="acceptance.html">定義表</a>、実際の操作手順は<a href="test-plan.html">検証プラン</a>にあります。<br>
    各行で <strong>合格／不合格／未実装</strong> を選び、実測値や気づきを所見に書いてください。上部に<strong>リリース判断</strong>が自動で出ます。<br>
    記入内容はこのブラウザに保存されます。共有するときは「TSVで書き出す」でファイルにしてください。
  </div>
  <div class="verdict" id="verdict"><div class="big" id="vbig">読み込み中…</div><div class="sub" id="vsub"></div></div>
  <div class="tools">
    <button class="f on" data-k="">すべて</button>
    <button class="f" data-k="L0">L0 のみ</button>
    <button class="f" data-k="M1">M1 データ基盤</button>
    <button class="f" data-k="M2">M2 計算</button>
    <button class="f" data-k="M3">M3 締め</button>
    <button class="f" data-k="M4">M4 画面・入出力</button>
    <button class="f" data-k="M5">M5 移行</button>
    <input id="q" type="search" placeholder="絞り込み">
    <input id="who" placeholder="確認者名（一括入力）" style="width:150px">
    <button id="export">TSVで書き出す</button>
    <a class="dl" id="dl" href="#" download>空の確認表をDL</a>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="box"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
var FILE='20260803_02b_従業員管理_受入条件_確認表.tsv', DEF='20260803_02_従業員管理_受入条件表.tsv';
document.getElementById('dl').href=encodeURI(FILE);
var rows=[], sev={}, quick='', key='ac-check-v1';
function st(){try{return JSON.parse(localStorage.getItem(key)||'{}');}catch(e){return {};}}
function save(o){try{localStorage.setItem(key,JSON.stringify(o));}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  var q=document.getElementById('q').value.toLowerCase(), s=st(), out='', n=0;
  for(var i=1;i<rows.length;i++){
    var r=rows[i], line=r.join(' ');
    if(quick && line.indexOf(quick)<0) continue;
    if(q && line.toLowerCase().indexOf(q)<0) continue;
    n++;
    var id=r[0], v=s[id]||{}, cls=(r[1].indexOf('L0')===0?'l0 ':'')+(v.j==='合格'?'ok':(v.j==='不合格'?'ng':''));
    out+='<tr class="'+cls+'"><td class="id">'+esc(id)+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td>'
       +'<td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td>'+esc(r[5])+'</td><td>'+esc(r[6])+'</td>'
       +'<td><select data-id="'+id+'" data-f="j" class="'+(v.j==='合格'?'ok':(v.j==='不合格'?'ng':''))+'">'
       +['','合格','不合格','未実装'].map(function(o){return '<option'+(v.j===o?' selected':'')+'>'+o+'</option>';}).join('')
       +'</select></td>'
       +'<td><input class="memo" data-id="'+id+'" data-f="m" value="'+esc(v.m||'')+'" placeholder="実測値・所見"></td>'
       +'<td><input class="memo" data-id="'+id+'" data-f="d" value="'+esc(v.d||'')+'" placeholder="MM/DD" style="width:70px"></td>'
       +'<td><input class="memo" data-id="'+id+'" data-f="w" value="'+esc(v.w||'')+'" style="width:90px"></td></tr>';
  }
  document.getElementById('tb').innerHTML=out;
  document.getElementById('cnt').textContent=n+' 件 / 全 '+(rows.length-1)+' 件';
  document.querySelectorAll('select,input.memo').forEach(function(el){
    el.addEventListener('change', function(){
      var o=st(), id=el.dataset.id; o[id]=o[id]||{}; o[id][el.dataset.f]=el.value; save(o); render(); judge();
    });
  });
}
function judge(){
  var s=st(), stop=[], must=[], cond=[];
  for(var i=1;i<rows.length;i++){
    var id=rows[i][0], sv=sev[id]||'no';
    if(sv==='stop') stop.push(id); else if(sv==='no') must.push(id); else if(sv==='cond') cond.push(id);
  }
  function ng(list){return list.filter(function(id){return (s[id]||{}).j!=='合格';});}
  function done(list){return list.length-ng(list).length;}
  var v=document.getElementById('verdict'), big=document.getElementById('vbig'), sub=document.getElementById('vsub');
  v.className='verdict';
  var ngStop=ng(stop), ngMust=ng(must), ngCond=ng(cond);
  if(ngStop.length){ v.classList.add('nogo'); big.textContent='✗ No-Go（L0が未達 '+done(stop)+'/'+stop.length+'）';
    sub.innerHTML='<strong>リリースできません。</strong>未達: '+ngStop.join('・'); }
  else if(ngMust.length){ v.classList.add('nogo'); big.textContent='△ 設計MVP未達（落とせない条件 '+(done(stop)+done(must))+'/'+(stop.length+must.length)+'）';
    sub.innerHTML='L0は満たしていますが、手作業で代替できない条件が'+ngMust.length+'件残っています。<br>未達: '+ngMust.join('・'); }
  else if(ngCond.length){ v.classList.add('cond'); big.textContent='◯ 条件付きGo（設計MVPクリア）';
    sub.innerHTML='落とせない条件はすべて合格。残りは手作業で代替できる'+ngCond.length+'件（'+ngCond.join('・')+'）。'; }
  else { v.classList.add('go'); big.textContent='◎ Go（すべて合格）'; sub.textContent='L0・L1のすべてが合格です。'; }
}
document.getElementById('export').addEventListener('click', function(){
  var s=st(), out=[rows[0].join('\t')];
  for(var i=1;i<rows.length;i++){ var r=rows[i].slice(), v=s[r[0]]||{}; r[7]=v.j||''; r[8]=v.m||''; r[9]=v.d||''; r[10]=v.w||''; out.push(r.join('\t')); }
  var b=new Blob(['﻿'+out.join('\n')],{type:'text/tab-separated-values'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='受入条件_確認表_記入済み.tsv'; a.click();
});
document.getElementById('who').addEventListener('change', function(){
  var o=st(); for(var i=1;i<rows.length;i++){ var id=rows[i][0]; o[id]=o[id]||{}; o[id].w=this.value; } save(o); render();
});
document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('button.f').forEach(function(b){ b.addEventListener('click', function(){
  document.querySelectorAll('button.f').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); quick=b.dataset.k; render(); }); });
Promise.all([fetch(encodeURI(FILE)).then(function(r){return r.text();}), fetch(encodeURI(DEF)).then(function(r){return r.text();})])
.then(function(t){
  rows=t[0].replace(/\r/g,'').replace(/\n+$/,'').split('\n').map(function(l){return l.split('\t');});
  var d=t[1].replace(/\r/g,'').split('\n').map(function(l){return l.split('\t');});
  var hi=d[0].indexOf('不合格のときリリースは'), ii=d[0].indexOf('条件ID');
  for(var i=1;i<d.length;i++){ if(!d[i][ii]) continue; var x=d[i][hi]||'';
    sev[d[i][ii]] = x.indexOf('★')===0?'stop':(x.indexOf('条件付きGo可')===0?'cond':(x.indexOf('影響なし')===0?'na':'no')); }
  document.getElementById('th').innerHTML='<tr>'+rows[0].map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>';
  render(); judge();
}).catch(function(e){document.getElementById('tb').innerHTML='<tr><td>読み込めませんでした: '+e+'</td></tr>';});
</script>
</body>
</html>

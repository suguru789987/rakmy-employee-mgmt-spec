<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受入条件表と確認表の使い方</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
body{margin:0;background:#f6f8fa}
.topbar{background:#bf8700;color:#fff;padding:12px 24px;font-weight:700;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topbar a{color:#fff;text-decoration:none;font-weight:400;font-size:14px;opacity:.9}
.topbar a:hover{opacity:1;text-decoration:underline}
.markdown-body{box-sizing:border-box;min-width:200px;max-width:1000px;margin:24px auto;padding:32px;background:#fff;border:1px solid #d0d7de;border-radius:8px}
.markdown-body pre{background:#f6f8fa;line-height:1.45}
.markdown-body table{display:block;overflow-x:auto;max-width:100%}
@media(max-width:720px){.markdown-body{padding:18px;margin:12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>.mermaid{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:16px;margin:16px 0;overflow-x:auto;text-align:center}</style>
</head>
<body>
<div class="topbar">
  📖 受入条件表と確認表の使い方
  <a href="index.html">← トップ</a>
  <a href="help.html">ヘルプページ</a>
  <a href="acceptance.html">定義表</a>
  <a href="acceptance-check.html">確認表</a>
  <a href="test-plan.html">検証プラン</a>
  <a href="milestone.html">実装マイルストーン</a>
</div>
<article id="content" class="markdown-body">読み込み中…</article>
<script>
var f = '20260803_04_受入条件表と確認表の使い方.md';
fetch(encodeURI(f)).then(function(r){return r.text();}).then(function(t){
  document.getElementById('content').innerHTML = marked.parse(t);
  (function(){
    var el = document.getElementById('content') || document.body;
    el.querySelectorAll('pre > code.language-mermaid').forEach(function(c){
      var d = document.createElement('div'); d.className='mermaid'; d.textContent=c.textContent;
      c.parentNode.replaceWith(d);
    });
    if (window.mermaid) {
      mermaid.initialize({startOnLoad:false, theme:'neutral', flowchart:{htmlLabels:true, curve:'basis'}});
      mermaid.run({querySelector:'.mermaid'});
    }
  })();
}).catch(function(e){
  document.getElementById('content').textContent = f + ' を読み込めませんでした: ' + e;
});
</script>
</body>
</html>
